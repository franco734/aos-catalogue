name: Publier les réponses Oracle approuvées

# Publication MANUELLE uniquement — bouton "Run workflow" sur github.com,
# onglet Actions. Voir ROADMAP.md (repo aos-explorer, section "Oracle des
# Règles") pour le circuit complet de double validation.
#
# Pourquoi pas de passage automatique (revue de sécurité du 07/08/2026) :
# la clé que transporte l'app peut créer une Issue ET lui poser l'étiquette
# "approuve-oracle", et elle s'authentifie sous l'identité du propriétaire
# du repo — impossible donc de distinguer une Issue légitime d'une Issue
# fabriquée par quelqu'un qui aurait extrait la clé du binaire. Un cron
# horaire publiait sans relecture tout ce qui portait l'étiquette, jusque
# dans l'app installée sur le téléphone d'Aidan.
#
# Ce token n'a AUCUN scope "Actions" : il ne peut pas déclencher ce
# workflow. Seul un collaborateur du repo, connecté sur github.com, le
# peut. La relecture humaine est donc garantie par construction, et non
# par convention.
on:
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publier les fiches Oracle approuvées
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/publier_oracle.py
